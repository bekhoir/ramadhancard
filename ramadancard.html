<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <title>Kartu Ucapan Ramadhan 1447 H</title>

        <!-- Google Font Montserrat -->
          <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

            <style>
                * {
                      box-sizing: border-box;
                            margin: 0;
                                  padding: 0;
                                        font-family: 'Montserrat', sans-serif;
                                            }

                                                body {
                                                      background: linear-gradient(135deg, #1e3c72, #2a5298);
                                                            min-height: 100vh;
                                                                  display: flex;
                                                                        flex-direction: column;
                                                                              color: #fff;
                                                                                  }

                                                                                      /* HEADER */
                                                                                          .header {
                                                                                          
                                                                                                background: #fff;
                                                                                                      width: 100%;
                                                                                                            padding: 12px 18px;
                                                                                                                  display: flex;
                                                                                                                        align-items: center;
                                                                                                                              box-shadow: 0 4px 6px rgba(0,0,0,.15);
                                                                                                                                  }

                                                                                                                                      .header img {
                                                                                                                                            height: 48px;
                                                                                                                                                }

                                                                                                                                                    /* CONTAINER */
                                                                                                                                                        .container {
                                                                                                                                                              flex: 1;
                                                                                                                                                                    width: 100%;
                                                                                                                                                                          max-width: 420px;
                                                                                                                                                                                padding: 25px;
                                                                                                                                                                                      text-align: center;
                                                                                                                                                                                            margin: 0 auto;
                                                                                                                                                                                                }

                                                                                                                                                                                                    .title {
                                                                                                                                                                                                          font-size: 20px;
                                                                                                                                                                                                                font-weight: 700;
                                                                                                                                                                                                                      margin-bottom: 20px;
                                                                                                                                                                                                                            color: #FFD700;
                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                    input {
                                                                                                                                                                                                                                          width: 100%;
                                                                                                                                                                                                                                                padding: 12px;
                                                                                                                                                                                                                                                      border-radius: 30px;
                                                                                                                                                                                                                                                            border: none;
                                                                                                                                                                                                                                                                  font-size: 15px;
                                                                                                                                                                                                                                                                        margin-bottom: 20px;
                                                                                                                                                                                                                                                                              text-align: center;
                                                                                                                                                                                                                                                                                    outline: none;
                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                            canvas {
                                                                                                                                                                                                                                                                                                  width: 100%;
                                                                                                                                                                                                                                                                                                        border-radius: 18px;
                                                                                                                                                                                                                                                                                                              margin-bottom: 20px;
                                                                                                                                                                                                                                                                                                                    background: #fff;
                                                                                                                                                                                                                                                                                                                          box-shadow: 0 8px 15px rgba(0,0,0,.25);
                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                  button {
                                                                                                                                                                                                                                                                                                                                        background: #FFD700;
                                                                                                                                                                                                                                                                                                                                              color: #333;
                                                                                                                                                                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                                                                                                                                                                          padding: 12px 22px;
                                                                                                                                                                                                                                                                                                                                                                border-radius: 30px;
                                                                                                                                                                                                                                                                                                                                                                      font-weight: 600;
                                                                                                                                                                                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                  transition: .3s;
                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                          button:hover {
                                                                                                                                                                                                                                                                                                                                                                                                background: #ffcc00;
                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                        .footer {
                                                                                                                                                                                                                                                                                                                                                                                                              font-size: 13px;
                                                                                                                                                                                                                                                                                                                                                                                                                    padding: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                          opacity: .85;
                                                                                                                                                                                                                                                                                                                                                                                                                                text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                      </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                      </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                      <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- HEADER -->
                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="header">
                                                                                                                                                                                                                                                                                                                                                                                                                                              <img src="img/logo-yayasan.png" alt="Logo Yayasan">
                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                  <!-- KONTEN -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="title">Kartu Ucapan Ramadhan 1447 H</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  type="text"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        id="name"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              placeholder="Masukkan nama Anda"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    oninput="updateCanvas()"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <canvas id="canvas"></canvas>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="downloadImage()">Unduh Kartu</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- FOOTER -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="footer">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          © 2026 Yayasan Mutiara Ahlussunnah Gresik
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const canvas = document.getElementById("canvas");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const ctx = canvas.getContext("2d");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          canvas.width = 768;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              canvas.height = 1414;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const img = new Image();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      img.src = "img/ramadancard.jpg";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          img.onload = () => drawBase();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function drawBase() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function updateCanvas() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        drawBase();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const name = document.getElementById("name").value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!name) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ctx.textAlign = "center";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.fillStyle = "#FFD700";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ctx.font = "600 35px Montserrat";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fillText(name, canvas.width / 2, 871);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function downloadImage() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const link = document.createElement("a");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                link.download = "Kartu-Ramadhan-1447H.png";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      link.href = canvas.toDataURL("image/png");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            link.click();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
